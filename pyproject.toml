[project]
name = "finlexpurple"
version = "0.1.0a1"
description = "Autonomous security testing agent (placeholder release)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "FinLexPurple" }]
dependencies = [
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "anthropic>=1.0",
    "openai>=2.0",
    "google-genai>=1.0",
    "ollama>=0.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
finlexpurple = "finlexpurple.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["src/finlexpurple/.env.example"]

[tool.mypy]
files = ["src/finlexpurple"]
python_version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
