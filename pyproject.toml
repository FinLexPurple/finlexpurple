[project]
name = "finlexpurple"
version = "0.3.0b1"
description = "Local, hardened autonomous security agent that tests a financial app and everything it trusts — AI/MCP, dependencies, and containers — with deterministically verified, cryptographically provable findings."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "FinLexPurple" }]
keywords = [
    "security",
    "pentest",
    "sast",
    "supply-chain",
    "container-security",
    "mcp",
    "fintech",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "anthropic>=1.0",
    "openai>=2.0",
    "google-genai>=1.0",
    "ollama>=0.5",
    "httpx>=0.27",
    "pyyaml>=6",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Homepage = "https://github.com/FinLexPurple/finlexpurple"
Repository = "https://github.com/FinLexPurple/finlexpurple"
Changelog = "https://github.com/FinLexPurple/finlexpurple/blob/main/CHANGELOG.md"
Issues = "https://github.com/FinLexPurple/finlexpurple/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
finlexpurple = "finlexpurple.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["src/finlexpurple/.env.example"]

[tool.mypy]
files = ["src/finlexpurple"]
python_version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
