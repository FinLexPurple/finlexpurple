name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run real hardware and setup smoke checks
        run: python -m pytest -q tests/finlexpurple/hardware/test_real_hardware_smoke.py
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run mypy for all target platforms
        run: |
          python -m mypy --platform win32
          python -m mypy --platform darwin
          python -m mypy --platform linux

  build:
    name: Build and validate distributions
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.metadata.outputs.is_stable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Verify tag version and classify release
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          if tag.removeprefix("v") != version:
              raise SystemExit(
                  f"Tag {tag!r} does not match pyproject.toml version {version!r}."
              )

          stable = re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", tag)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_stable={'true' if stable else 'false'}\n")
          PY
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Upload distributions for publishing
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub Release notes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract this version's CHANGELOG section
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next(
              (i for i, line in enumerate(lines) if line.startswith(f"## [{version}]")),
              None,
          )
          if start is None:
              raise SystemExit(f"No CHANGELOG.md section for version {version!r}.")
          end = next(
              (j for j in range(start + 1, len(lines)) if lines[j].startswith("## ")),
              len(lines),
          )
          body = "\n".join(lines[start:end]).strip() + "\n"
          Path("release-notes.md").write_text(body, encoding="utf-8")
          print(body)
          PY
      - name: Create or update the GitHub Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          # A tag without a plain vMAJOR.MINOR.PATCH form is a pre-release.
          IS_STABLE: ${{ needs.build.outputs.is_stable }}
        run: |
          prerelease_flag="--prerelease"
          if [ "$IS_STABLE" = "true" ]; then
            prerelease_flag=""
          fi
          # Idempotent: create the Release, or update its notes if it already exists.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              $prerelease_flag
          fi

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/finlexpurple
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # PEP 740 Sigstore build provenance (§28 #2): the action signs the
          # distributions with the workflow's OIDC identity and uploads the
          # attestations alongside them. Explicit for intent; this is the default.
          attestations: true

  publish-pypi:
    name: Publish stable release to PyPI
    needs: [build, publish-testpypi]
    if: needs.build.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-production
      url: https://pypi.org/p/finlexpurple
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PEP 740 Sigstore build provenance (§28 #2): signed attestations are
          # generated from the workflow's OIDC identity and published to PyPI.
          attestations: true
