name: Tests

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run real hardware and setup smoke checks
        run: python -m pytest -q tests/finlexpurple/hardware/test_real_hardware_smoke.py
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run mypy
        run: |
          python -m mypy --platform win32
          python -m mypy --platform darwin
          python -m mypy --platform linux

  supply-chain:
    name: Our-own-package supply-chain integrity (§28 #2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install our package and pip-audit
        run: |
          python -m pip install -e .
          python -m pip install "pip-audit>=2.7"
      - name: Audit our own dependencies for known vulnerabilities
        # Audits our runtime dependencies against the PyPI advisory database; a
        # known-vulnerable dependency fails the build. We audit a frozen list of the
        # non-editable installs rather than the environment, so our own editable
        # self-install is excluded cleanly: it is the package under development, not
        # a dependency, and is not on PyPI before release, so auditing it would fail
        # with "not found on PyPI" for every unpublished version. (--skip-editable
        # alone does not help here: under --strict the skipped editable is itself a
        # collection failure.) --strict still applies to every real dependency.
        run: |
          python -m pip freeze --exclude-editable > audit-requirements.txt
          python -m pip_audit --strict -r audit-requirements.txt --progress-spinner off
      - name: Dependency-confusion namespace guard
        # Fails if anything in the finlexpurple namespace is installed that we do
        # not publish, or that lacks our first-party provenance.
        run: |
          python - <<'PY'
          import sys
          from finlexpurple.supplychain.namespace_guard import audit_environment
          warnings = audit_environment()
          for w in warnings:
              print(f"::error::namespace guard: {w.distribution} — {w.reason}")
          sys.exit(1 if warnings else 0)
          PY
